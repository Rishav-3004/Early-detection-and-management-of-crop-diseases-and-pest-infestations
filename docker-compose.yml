version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: crop_disease_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: crop_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crop_disease_backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - DEMO_MODE=True
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/crop_db
      - SECRET_KEY=supersecretproductionkeypleasechangeinproduction987654321
      - CORS_ORIGINS=["http://localhost:3000"]
      - UPLOAD_DIR=/app/uploads
      - MODEL_PROVIDER=mock
      - MODEL_VERSION=v1.2.0-agrishield
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crop_disease_frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:
