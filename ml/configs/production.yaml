# AgriShield AI Production Model Configuration
model:
  name: "AgriShield-Vision-Ensemble"
  version: "v2.0.0-agrishield-prod"
  architecture: "gradient_boosting_multiscale_ensemble"
  target_size: [128, 128]

training:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  seed: 42
  augmentation_probability: 0.60
  n_estimators: 120
  learning_rate: 0.08
  max_depth: 5

quality_gate:
  min_blur_threshold: 18.0
  min_exposure: 25.0
  max_exposure: 235.0
  min_vegetation_ratio: 0.08

calibration:
  method: "temperature_scaling"
  num_bins: 10

uncertainty:
  high_confidence_threshold: 0.80
  medium_confidence_threshold: 0.58
  max_entropy_threshold: 1.95
  min_margin_threshold: 0.12

target_states:
  - Maharashtra
  - Gujarat
  - Punjab
  - Haryana
  - Madhya Pradesh
  - Chhattisgarh
